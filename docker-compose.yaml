services:
  webapp:
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    extra_hosts:
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  assistant:
    build:
      context: .
      dockerfile: apps/assistant/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    extra_hosts:
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  roi:
    build:
      context: .
      dockerfile: apps/roi/Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    extra_hosts:
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"
  grid:
    build:
      context: .
      dockerfile: apps/grid/Dockerfile
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    extra_hosts:
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"
