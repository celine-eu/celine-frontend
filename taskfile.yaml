version: "3"

vars:
  IMAGE_WEBAPP: ghcr.io/celine-eu/celine-webapp
  IMAGE_ASSISTANT: ghcr.io/celine-eu/celine-assistant
  IMAGE_GRID: ghcr.io/celine-eu/celine-grid-ui

tasks:
  setup:
    desc: Setup
    cmds:
      - pnpm install

  # Development
  dev:webapp:
    desc: Run webapp in development mode
    cmds:
      - pnpm dev:webapp

  dev:assistant:
    desc: Run assistant in development mode
    cmds:
      - pnpm dev:assistant

  dev:roi:
    desc: Run ROI estimator in development mode
    cmds:
      - pnpm dev:roi

  dev:grid:
    desc: Run grid app in development mode
    cmds:
      - pnpm dev:grid

  # Build
  build:
    desc: Build all apps
    cmds:
      - pnpm build

  build:webapp:
    desc: Build webapp
    cmds:
      - pnpm build:webapp

  build:roi:
    desc: Build roi
    cmds:
      - pnpm build:roi

  build:assistant:
    desc: Build assistant
    cmds:
      - pnpm build:assistant

  build:grid:
    desc: Build grid app
    cmds:
      - pnpm build:grid

  release:
    cmds:
      - task release:webapp
      - task release:assistant
      - task release:roi
      - task release:grid

  # Release - auto version based on conventional commits
  release:webapp:
    desc: Release webapp (auto version from commits, generates changelog)
    dir: apps/webapp
    cmds:
      - npx release-it --ci {{.CLI_ARGS}}

  release:assistant:
    desc: Release assistant (auto version from commits, generates changelog)
    dir: apps/assistant
    cmds:
      - npx release-it --ci {{.CLI_ARGS}}

  release:roi:
    desc: Release roi (auto version from commits, generates changelog)
    dir: apps/roi
    cmds:
      - npx release-it --ci {{.CLI_ARGS}}

  release:grid:
    desc: Release grid app (auto version from commits, generates changelog)
    dir: apps/grid
    cmds:
      - npx release-it --ci {{.CLI_ARGS}}

  # Dry run to preview release
  release:webapp:dry:
    desc: Preview webapp release (dry run)
    dir: apps/webapp
    cmds:
      - npx release-it --dry-run

  release:assistant:dry:
    desc: Preview assistant release (dry run)
    dir: apps/assistant
    cmds:
      - npx release-it --dry-run

  release:grid:dry:
    desc: Preview grid release (dry run)
    dir: apps/grid
    cmds:
      - npx release-it --dry-run

  # Docker builds
  docker:webapp:
    desc: Build webapp Docker image
    cmds:
      - docker build -f apps/webapp/Dockerfile -t {{.IMAGE_WEBAPP}}:dev .

  docker:assistant:
    desc: Build assistant Docker image
    cmds:
      - docker build -f apps/assistant/Dockerfile -t {{.IMAGE_ASSISTANT}}:dev .

  docker:grid:
    desc: Build grid Docker image
    cmds:
      - docker build -f apps/grid/Dockerfile -t {{.IMAGE_GRID}}:dev .

  docker:all:
    desc: Build all Docker images
    cmds:
      - task: docker:webapp
      - task: docker:assistant
      - task: docker:grid
